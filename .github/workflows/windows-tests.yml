name: Windows fixtures

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-fixtures-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    name: Build all fixtures, run portable tier
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_ROOT: C:\b-fixtures
      TOOL_ROOT: C:\t-fixtures
      PIP_CACHE_DIR: C:\t-fixtures\pip
      RESULTS: C:\ci-fixtures
      PYTHONDONTWRITEBYTECODE: '1'
      CANDIDATE_BACKEND_SHA: ${{ github.sha }}
      CANDIDATE_SHELL_SHA: 327ef65455a2d8de863e4c2bd106b0b2a781e3dc

    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Start candidate receipt before setup
        run: |
          python -B .github/scripts/candidate_contract.py --receipt "$env:RESULTS/candidate-result.json" init `
            --backend-sha $env:CANDIDATE_BACKEND_SHA --shell-sha $env:CANDIDATE_SHELL_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout canonical public toolchain contract
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: KldsSeeGhosts/caelestia-windows
          ref: ab54ebb6cd3e2d8ab6f459bb683faa0e71038b5b
          path: toolchain-contract
          persist-credentials: false

      - name: Verify exact clean sources
        run: |
          python -B .github/scripts/candidate_contract.py --receipt "$env:RESULTS/candidate-result.json" sources `
            --backend . --shell toolchain-contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Python 3.12
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Validate producer contract fixtures
        run: |
          python -B .github/scripts/candidate_contract.py --receipt "$env:RESULTS/candidate-result.json" run `
            --stage producer --unittest --echo -- python -B -m unittest discover -s .github/candidate-contract -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore versioned tooling
        id: tools
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: windows-x64-fixture-contract-v1-py${{ steps.python.outputs.python-version }}-${{ hashFiles('toolchain-contract/windows/toolchain.json', 'toolchain-contract/windows/toolchain/*.lock.txt') }}
          path: |
            C:\t-fixtures\Qt
            C:\t-fixtures\downloads
            C:\t-fixtures\pip
            C:\t-fixtures\clang+llvm-20.1.8-x86_64-pc-windows-msvc
            C:\t-fixtures\deps\CLI11-2.5.0

      - name: Prepare and assert canonical tooling
        run: |
          $ErrorActionPreference = 'Stop'
          python -B .github/scripts/candidate_contract.py --receipt "$env:RESULTS/candidate-result.json" run `
            --stage prepare --echo -- powershell.exe -NoProfile -NonInteractive -File toolchain-contract/windows/scripts/Prepare-Toolchain.ps1 `
            -ToolRoot $env:TOOL_ROOT -InstallRust
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save tooling from trusted main only
        if: steps.tools.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: ${{ steps.tools.outputs.cache-primary-key }}
          path: |
            C:\t-fixtures\Qt
            C:\t-fixtures\downloads
            C:\t-fixtures\pip
            C:\t-fixtures\clang+llvm-20.1.8-x86_64-pc-windows-msvc
            C:\t-fixtures\deps\CLI11-2.5.0

      - name: Build every fixture
        run: |
          $ErrorActionPreference = 'Stop'
          python -B .github/scripts/candidate_contract.py --receipt "$env:RESULTS/candidate-result.json" run `
            --stage configure --echo -- powershell.exe -NoProfile -NonInteractive -File .github/scripts/Invoke-WindowsFixtureGate.ps1 `
            -Phase Configure -ContractRoot toolchain-contract -ToolRoot $env:TOOL_ROOT -BuildRoot $env:BUILD_ROOT -Results $env:RESULTS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .github/scripts/candidate_contract.py --receipt "$env:RESULTS/candidate-result.json" run `
            --stage build --echo -- powershell.exe -NoProfile -NonInteractive -File .github/scripts/Invoke-WindowsFixtureGate.ps1 `
            -Phase Build -ContractRoot toolchain-contract -ToolRoot $env:TOOL_ROOT -BuildRoot $env:BUILD_ROOT -Results $env:RESULTS -Jobs 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .github/scripts/candidate_contract.py --receipt "$env:RESULTS/candidate-result.json" inventory `
            --ctest "$env:TOOL_ROOT/tools/Scripts/ctest.exe" --build $env:BUILD_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run portable fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          python -B .github/scripts/candidate_contract.py --receipt "$env:RESULTS/candidate-result.json" run `
            --stage portable --junit "$env:RESULTS/portable.raw.xml" --echo -- `
            powershell.exe -NoProfile -NonInteractive -File .github/scripts/Invoke-WindowsFixtureGate.ps1 `
            -Phase Portable -ContractRoot toolchain-contract -ToolRoot $env:TOOL_ROOT -BuildRoot $env:BUILD_ROOT -Results $env:RESULTS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Finalize sanitized candidate result
        if: always()
        env:
          WORKFLOW_OUTCOME: ${{ job.status }}
        run: |
          python -B .github/scripts/candidate_contract.py --receipt "$env:RESULTS/candidate-result.json" finalize `
            --workflow-outcome $env:WORKFLOW_OUTCOME --toolchain "$env:RESULTS/actual-toolchain.json" `
            --backend . --shell toolchain-contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test results and public toolchain receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fixture-results-${{ github.run_id }}
          path: |
            C:\ci-fixtures\portable.xml
            C:\ci-fixtures\candidate-result.json
          if-no-files-found: warn
          retention-days: 7
