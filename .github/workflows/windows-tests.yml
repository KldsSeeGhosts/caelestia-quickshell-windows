name: Windows fixtures

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-fixtures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Build all fixtures, run portable tier
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_ROOT: C:\b-fixtures
      TOOL_ROOT: C:\t-fixtures
      PIP_CACHE_DIR: C:\t-fixtures\pip
      RESULTS: C:\ci-fixtures

    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Checkout canonical public toolchain contract
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: KldsSeeGhosts/caelestia-windows
          ref: 55a236ee72fc36bdf0ba8a499a1039fe997fe2c9
          path: toolchain-contract
          persist-credentials: false

      - name: Python 3.12
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Restore versioned tooling
        id: tools
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: windows-x64-fixture-contract-v1-py${{ steps.python.outputs.python-version }}-${{ hashFiles('toolchain-contract/windows/toolchain.json', 'toolchain-contract/windows/toolchain/*.lock.txt') }}
          path: |
            C:\t-fixtures\Qt
            C:\t-fixtures\downloads
            C:\t-fixtures\pip
            C:\t-fixtures\clang+llvm-20.1.8-x86_64-pc-windows-msvc
            C:\t-fixtures\deps\CLI11-2.5.0

      - name: Prepare and assert canonical tooling
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:RESULTS | Out-Null
          & powershell.exe -NoProfile -NonInteractive -File toolchain-contract/windows/scripts/Prepare-Toolchain.ps1 `
            -ToolRoot $env:TOOL_ROOT -InstallRust
          if ($LASTEXITCODE -ne 0) { throw 'Canonical public toolchain preparation failed.' }

      - name: Save tooling from trusted main only
        if: steps.tools.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: ${{ steps.tools.outputs.cache-primary-key }}
          path: |
            C:\t-fixtures\Qt
            C:\t-fixtures\downloads
            C:\t-fixtures\pip
            C:\t-fixtures\clang+llvm-20.1.8-x86_64-pc-windows-msvc
            C:\t-fixtures\deps\CLI11-2.5.0

      - name: Build every fixture
        run: |
          $ErrorActionPreference = 'Stop'
          . ./toolchain-contract/windows/scripts/Caelestia-Toolchain.ps1
          $spec = Get-CaelestiaToolchain
          $qt = Join-Path $env:TOOL_ROOT $spec.qtDirectory
          $llvm = Join-Path $env:TOOL_ROOT "$($spec.llvmDirectory)\bin"
          $instance = Enter-CaelestiaToolchain -QtPrefix $qt -LlvmBin $llvm -ToolsBin "$env:TOOL_ROOT\tools\Scripts"
          Select-CaelestiaRust
          $receipt = Get-CaelestiaActualToolchain -QtPrefix $qt -Cli11Include (Join-Path $env:TOOL_ROOT $spec.cli11Directory)
          [ordered]@{
            schemaVersion = 1
            toolchain = $receipt
            backendRevision = (& git rev-parse HEAD).Trim()
            toolchainSourceRevision = (& git -C toolchain-contract rev-parse HEAD).Trim()
            vsInstallationVersion = $instance.installationVersion
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "$env:RESULTS\toolchain.json" -Encoding UTF8
          $mt = Join-Path $env:WindowsSdkDir "bin\$($spec.windowsSdkVersion)\x64\mt.exe"
          cmake -S src/windows/test -B $env:BUILD_ROOT -G Ninja "-DCMAKE_PREFIX_PATH=$qt" `
            "-DCMAKE_CXX_COMPILER:FILEPATH=$llvm\clang-cl.exe" "-DCMAKE_MT:FILEPATH=$mt" `
            "-DCMAKE_LINKER:FILEPATH=$env:VCToolsInstallDir\bin\Hostx64\x64\link.exe" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Fixture configuration failed.' }
          cmake --build $env:BUILD_ROOT --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Fixture build failed.' }

      - name: Run portable fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          $qt = "$env:TOOL_ROOT\Qt\6.11.2\msvc2022_64"
          $env:PATH = "$env:TOOL_ROOT\tools\Scripts;$qt\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = "$qt\plugins\platforms"
          $env:QT_QUICK_BACKEND = 'software'
          $temp = "$env:RESULTS\temp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          $env:TEMP = $temp
          $env:TMP = $temp
          ctest --test-dir $env:BUILD_ROOT -L '^portable$' --no-tests=error --output-on-failure `
            --output-junit "$env:RESULTS\portable.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Portable fixtures failed.' }

      - name: Test results and public toolchain receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fixture-results-${{ github.run_id }}
          path: |
            C:\ci-fixtures\portable.xml
            C:\ci-fixtures\toolchain.json
            C:\t-fixtures\toolchain.json
          if-no-files-found: ignore
          retention-days: 7
